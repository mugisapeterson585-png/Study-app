name: Build Android APK

# Runs on every push to main/master, and can also be started by hand
# from the Actions tab ("Run workflow").
# (Updated: cancels older runs when a new one starts, so builds don't pile up.)
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub installs Gradle itself, so no gradlew / wrapper jar is needed in the repo.
      # Version 8.4 matches the project (Android Gradle Plugin 8.3.1).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      # The project has no launcher icon but the manifest asks for one,
      # so create a simple one when it is missing.
      - name: Add launcher icon if missing
        run: |
          RES=app/src/main/res
          if [ -z "$(find $RES -name 'ic_launcher.*' 2>/dev/null)" ]; then
            mkdir -p $RES/mipmap-anydpi-v24
            cat > $RES/mipmap-anydpi-v24/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1E2127" android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#6EA8FE"
                  android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:pathData="M30,64 C30,32 78,32 78,64" />
              <path android:fillColor="#6EA8FE" android:pathData="M24,60h12v22h-12z" />
              <path android:fillColor="#6EA8FE" android:pathData="M72,60h12v22h-12z" />
          </vector>
          EOF
            cp $RES/mipmap-anydpi-v24/ic_launcher.xml $RES/mipmap-anydpi-v24/ic_launcher_round.xml
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SilentStudy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
